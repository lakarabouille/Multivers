<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dimension Picotement – pH 9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#eee;font-family:'Nunito',sans-serif;min-height:100vh;padding:20px;}
    .dim-nav{display:flex;gap:8px;margin-bottom:20px;}
    .retour,.accueil{padding:7px 14px;font-weight:900;border-radius:7px;text-decoration:none;font-size:.9rem;}
    .retour{background:#009944;color:white;}
    .accueil{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.2);}
    h1{font-family:'Bangers',cursive;font-size:2.4rem;color:#44ff88;letter-spacing:.07em;margin-bottom:4px;}
    .sub{color:#228844;margin-bottom:24px;font-size:.95rem;}
    #zone{
      width:100%;max-width:500px;height:260px;border-radius:16px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      font-size:1.4rem;font-weight:900;user-select:none;
      background:#222;border:2px solid #444;
      transition:background .15s;margin:0 auto 20px;
    }
    #zone.wait{background:#222;border-color:#444;}
    #zone.ready{background:#115500;border-color:#44ff44;}
    #zone.go{background:#009900;border-color:#00ff44;animation:pulse .4s ease infinite alternate;}
    @keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
    #zone.too-early{background:#550000;border-color:#ff4444;}
    .zone-emoji{font-size:3rem;}
    .results{max-width:500px;margin:0 auto;text-align:center;}
    .time-display{font-family:'Bangers',cursive;font-size:3rem;color:#44ff88;margin:10px 0;}
    .best{color:#888;margin-bottom:14px;}
    .rounds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
    .round-dot{padding:6px 12px;border-radius:8px;background:rgba(68,255,136,.1);border:1px solid rgba(68,255,136,.2);font-size:.85rem;color:#88ffbb;}
    .btn{padding:12px 28px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;background:#009944;color:white;}
  </style>
</head>
<body>
  <div class="dim-nav">
    <a href="rick_morty.html" class="retour">← Portail</a>
    <a href="index.html" class="accueil">🏠 Accueil</a>
  </div>
  <h1>⚡ Dimension Picotement</h1>
  <p class="sub">pH 9 — Ça pique. Juste un peu. Assez pour tester tes réflexes. Clique DÈS que c'est vert !</p>

  <div id="zone" class="wait">
    <div class="zone-emoji" id="zone-emoji">⏳</div>
    <div id="zone-text">Clique pour commencer</div>
  </div>

  <div class="results">
    <div id="rounds-display" class="rounds"></div>
    <div class="time-display" id="time-disp" style="display:none"></div>
    <div class="best" id="best-disp"></div>
    <button class="btn" id="reset-btn" style="display:none" onclick="reset()">Nouvel essai</button>
  </div>

  <script>
    let state='idle', t0=0, results=[], timeout;
    const ROUNDS=5;
    const zone=document.getElementById('zone');
    const zoneText=document.getElementById('zone-text');
    const zoneEmoji=document.getElementById('zone-emoji');
    const timeDisp=document.getElementById('time-disp');
    const bestDisp=document.getElementById('best-disp');
    const resetBtn=document.getElementById('reset-btn');

    function setState(s){
      state=s;
      zone.className='zone '+s;
      if(s==='wait'){zoneEmoji.textContent='⏳';zoneText.textContent='Attends…';}
      if(s==='go'){zoneEmoji.textContent='🟢';zoneText.textContent='MAINTENANT !';}
      if(s==='too-early'){zoneEmoji.textContent='❌';zoneText.textContent='Trop tôt !';}
    }

    function startRound(){
      setState('wait');
      const delay=Math.random()*3000+1000;
      timeout=setTimeout(()=>{setState('go');t0=Date.now();},delay);
    }

    zone.addEventListener('click',()=>{
      if(state==='idle'||state==='done'){startRound();return;}
      if(state==='wait'){
        clearTimeout(timeout);
        setState('too-early');
        setTimeout(startRound,1200);
        return;
      }
      if(state==='go'){
        const rt=Date.now()-t0;
        results.push(rt);
        const rd=document.getElementById('rounds-display');
        const dot=document.createElement('div');
        dot.className='round-dot';
        dot.textContent=`#${results.length}: ${rt}ms`;
        rd.appendChild(dot);
        if(results.length>=ROUNDS){
          endGame();
        }else{
          setState('wait');
          zoneText.textContent=`${rt}ms — encore ${ROUNDS-results.length} essai(s)`;
          setTimeout(startRound,900);
        }
      }
    });

    function endGame(){
      state='done';
      zone.className='zone wait';
      zoneEmoji.textContent='🏁';
      zoneText.textContent='Terminé !';
      const avg=Math.round(results.reduce((a,b)=>a+b,0)/results.length);
      const best=Math.min(...results);
      timeDisp.textContent=`Moyenne : ${avg}ms`;
      timeDisp.style.display='block';
      const verdict=avg<200?'🚀 Réflexes de Rick. Inquiétant.':avg<300?'⚡ Excellent. Tu survis au picotement.':avg<450?'👍 Correct. Rick hausserait les épaules.':'🐌 Morty est plus rapide. Et ça dit tout.';
      bestDisp.textContent=`Meilleur : ${best}ms — ${verdict}`;
      resetBtn.style.display='inline-block';
    }

    function reset(){
      results=[];state='idle';
      document.getElementById('rounds-display').innerHTML='';
      timeDisp.style.display='none';bestDisp.textContent='';
      resetBtn.style.display='none';
      zone.className='zone wait';
      zoneEmoji.textContent='⏳';
      zoneText.textContent='Clique pour commencer';
    }
  </script>
</body>
</html>
