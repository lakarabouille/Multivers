<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dimension Mensonge – pH 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:linear-gradient(135deg,#0a0015,#150025);color:#ddaaff;font-family:'Nunito',sans-serif;min-height:100vh;padding:20px;}
    .dim-nav{display:flex;gap:8px;margin-bottom:20px;}
    .retour,.accueil{padding:7px 14px;font-weight:900;border-radius:7px;text-decoration:none;font-size:.9rem;}
    .retour{background:#8800cc;color:white;}
    .accueil{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.2);}
    h1{font-family:'Bangers',cursive;font-size:2.4rem;color:#cc88ff;letter-spacing:.07em;margin-bottom:4px;}
    .sub{color:#9966bb;margin-bottom:24px;font-size:.95rem;}
    .game-box{max-width:600px;}
    .score-row{display:flex;gap:12px;margin-bottom:20px;}
    .sb{padding:8px 16px;border-radius:8px;background:rgba(136,0,204,.1);border:1px solid rgba(136,0,204,.3);font-weight:900;color:#cc88ff;}
    .quote-card{background:rgba(0,0,0,.4);border:2px solid rgba(136,0,204,.3);border-radius:14px;padding:24px;margin-bottom:20px;min-height:100px;}
    .quote-label{font-size:.85rem;color:#9966bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
    .quote-text{font-size:1.2rem;font-style:italic;line-height:1.5;color:white;}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .btn-vrai,.btn-faux{padding:16px;border:none;border-radius:10px;font-weight:900;font-size:1.1rem;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .15s;}
    .btn-vrai{background:#22cc44;color:black;}
    .btn-faux{background:#cc2244;color:white;}
    .btn-vrai:hover,.btn-faux:hover{transform:scale(1.04);}
    .feedback{padding:14px;border-radius:10px;background:rgba(0,0,0,.4);font-style:italic;color:#ddaaff;line-height:1.5;display:none;margin-bottom:12px;}
    .next-btn{padding:10px 24px;background:#8800cc;border:none;border-radius:8px;color:white;font-weight:900;cursor:pointer;display:none;font-family:'Nunito',sans-serif;}
    .result-box{text-align:center;display:none;}
    .result-box h2{font-family:'Bangers',cursive;font-size:2.2rem;color:#cc88ff;letter-spacing:.06em;margin-bottom:10px;}
    .result-box p{color:#ddaaff;margin-bottom:16px;line-height:1.5;}
    .restart{padding:12px 24px;background:#8800cc;border:none;border-radius:8px;color:white;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;}
  </style>
</head>
<body>
  <div class="dim-nav">
    <a href="rick_morty.html" class="retour">← Portail</a>
    <a href="index.html" class="accueil">🏠 Accueil</a>
  </div>
  <h1>🤥 Dimension Mensonge</h1>
  <p class="sub">pH 4 — Rick ment en disant que "ça pique juste un peu". Ici tout le monde ment. Détecte la vérité.</p>

  <div class="game-box">
    <div id="quiz-screen">
      <div class="score-row">
        <div class="sb">Question : <span id="q-num">1</span>/8</div>
        <div class="sb">Score : <span id="score">0</span></div>
      </div>
      <div class="quote-card">
        <div class="quote-label">Rick affirme :</div>
        <div class="quote-text" id="quote-text"></div>
      </div>
      <div class="btn-row">
        <button class="btn-vrai" id="btn-v">✅ VRAI</button>
        <button class="btn-faux" id="btn-f">❌ FAUX</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn">Suite →</button>
    </div>
    <div class="result-box" id="result-box">
      <h2 id="r-title"></h2>
      <p id="r-text"></p>
      <button class="restart" onclick="init()">Rejouer</button>
    </div>
  </div>

  <script>
    const Q=[
      {q:'"Le liquide de portail est totalement inoffensif."',a:false,fb:'FAUX. Il dissout les cailloux. Et les chaussures. Et parfois les souvenirs.'},
      {q:'"Morty est mon partenaire préféré."',a:true,fb:'VRAI. Même si Rick ne le dira jamais de vive voix. Il l\'a écrit dans une dimension où personne ne peut le lire.'},
      {q:'"Jerry n\'est pas inutile."',a:false,fb:'FAUX. Rick a consacré 3 pages de son carnet à lister les inutilités de Jerry. En ordre alphabétique.'},
      {q:'"Le multivers n\'est pas infini."',a:false,fb:'FAUX. Le multivers est techniquement infini. Ce qui déprime Rick le lundi.'},
      {q:'"Rick dort parfois."',a:true,fb:'VRAI. Il dort 2h par nuit en position assise. Il appelle ça "optimiser le ratio productivité/inconsciensance".'},
      {q:'"Summer est plus capable que Morty."',a:true,fb:'VRAI. Rick ne le dira jamais officiellement mais Summer a résolu 4 crises interdimensionnelles sans l\'aide de personne.'},
      {q:'"Le pH 7 est totalement neutre et sans danger."',a:false,fb:'FAUX. Comme l\'échelle l\'indique : "ça explose juste parfois". Rick appelle ça "acceptable".'},
      {q:'"Rick fait des erreurs."',a:true,fb:'VRAI. C\'est la seule chose honnête qu\'il admet. Mais seulement dans des dimensions où personne ne l\'entend.'},
    ];

    let cur=0, score=0;

    function init(){
      cur=0;score=0;
      document.getElementById('quiz-screen').style.display='block';
      document.getElementById('result-box').style.display='none';
      render();
    }

    function render(){
      document.getElementById('q-num').textContent=cur+1;
      document.getElementById('score').textContent=score;
      document.getElementById('quote-text').textContent=Q[cur].q;
      document.getElementById('feedback').style.display='none';
      document.getElementById('next-btn').style.display='none';
      document.getElementById('btn-v').disabled=false;
      document.getElementById('btn-f').disabled=false;
    }

    function answer(val){
      document.getElementById('btn-v').disabled=true;
      document.getElementById('btn-f').disabled=true;
      const correct=val===Q[cur].a;
      if(correct)score++;
      document.getElementById('score').textContent=score;
      const fb=document.getElementById('feedback');
      fb.textContent=(correct?'✅ Correct ! ':'❌ Faux ! ')+Q[cur].fb;
      fb.style.display='block';
      const nb=document.getElementById('next-btn');
      nb.style.display='inline-block';
      nb.textContent=cur<Q.length-1?'Suite →':'Résultat';
    }

    document.getElementById('btn-v').addEventListener('click',()=>answer(true));
    document.getElementById('btn-f').addEventListener('click',()=>answer(false));
    document.getElementById('next-btn').addEventListener('click',()=>{
      cur++;
      if(cur<Q.length){render();}
      else{
        document.getElementById('quiz-screen').style.display='none';
        const box=document.getElementById('result-box');
        box.style.display='block';
        const v=score>=7?['🏆 Détecteur de vérité','Impressionnant. Tu résistes aux parasites de la mémoire. Rick t\'engagerait comme agent double.']:score>=5?['👀 Pas mal','Tu détectes la moitié des mensonges. Soit tu t\'améliores, soit tu rejoins l\'équipe de Jerry.']:['💀 Tu t\'es fait avoir','Cette dimension t\'a eu. Rick note : "candidat parfait pour une dimension de remplacement".'];
        document.getElementById('r-title').textContent=v[0];
        document.getElementById('r-text').textContent=`Score : ${score}/8 — ${v[1]}`;
        box.style.display='block';
      }
    });

    init();
  </script>
</body>
</html>
